name: CI

on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Unit tests
        run: node --experimental-strip-types --test "src/**/*.test.ts"

      - name: Build ts0
        run: node --experimental-strip-types src/cli.ts build

      - name: Hand off the build
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: ts0
          path: dist/ts0

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Take the build hand-off
        uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ts0
          path: dist

      - name: Link ts0 globally
        run: npm link

      # Every behavioural assertion about the CLI lives here; docs/testing.md says what each covers.
      - name: Behaviour suites (dats)
        uses: wow-look-at-my/dats@master
        with:
          tests: tests/

      # Not a test (tests/samples.dats asserts these): it builds the pages the publish job serves.
      - name: Build html samples for the sample site
        run: |
          ts0 build --config samples/html/ts0.json
          ts0 build --config samples/html-jsx/ts0.json

      # Both samples emit index.html, so each gets its own directory.
      - name: Stage the sample site
        if: always()
        run: |
          mkdir -p sample-site/html sample-site/html-jsx
          cp samples/html/dist/index.html sample-site/html/index.html
          cp samples/html-jsx/dist/index.html sample-site/html-jsx/index.html

      - name: Hand off the sample site
        if: always()
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: html-samples
          path: sample-site

  # Packages ts0 for buildhost; the contract is docs/prebuilt-ts0-cjs.md.
  prebuilt:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build ts0.cjs + esbuild natives
        run: npm run build:prebuilt

      - name: Bare-node smoke (node on PATH, no npm)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

      - name: Hand off the prebuilt bundle
        uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: prebuilt
          path: build-prebuilt/out/

  # Repeats the smoke on real arm64, so the linux/arm64 esbuild native runs end to end.
  smoke-prebuilt-linux-arm64:
    needs: prebuilt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The samples resolve @types/node and preact here: project deps, not toolchain.
      - run: npm ci

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: prebuilt
          path: build-prebuilt/out

      - name: Bare-node smoke (linux/arm64)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

  # Every branch publishes; "latest" still only ever resolves the default branch.
  publish:
    needs: [test, prebuilt, smoke-prebuilt-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # write, not read: the cache-cleanup step deletes this run's hand-offs.
      actions: write
      checks: read
      artifact-metadata: write
      deployments: write
    steps:
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: prebuilt
          path: build-prebuilt/out

      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build-prebuilt/out

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: html-samples
          path: sample-site

      # buildhost serves a site under one path segment, so a slash in the branch name has to go.
      - name: Site branch name
        id: sitebranch
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            core.setOutput('branch', (github.ref_name || 'branch').replace(/[^A-Za-z0-9._-]/g, '-'));

      - name: Publish the html samples
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          server: https://pazer.build
          project: ts0
          branch: ${{ steps.sitebranch.outputs.branch }}
          source_dir: sample-site
          public: 'true'

      # The hand-offs are this run's only; nothing outside it reads them.
      - name: Clean up the cache hand-offs
        if: always()
        uses: wow-look-at-my/actions@cache-cleanup#latest
