name: CI

on:
  push:

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Unit tests
        run: node --experimental-strip-types --test "src/**/*.test.ts"

      - name: Build ts0
        run: node --experimental-strip-types src/cli.ts build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts0
          path: dist/ts0

  test:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ts0
          path: dist

      - name: Link ts0 globally
        run: npm link

      # go-toolchain bundles dats and runs .dats suites itself, but it
      # hard-requires a go.mod and this repo is TypeScript, so the binary is
      # fetched directly -- a public buildhost download needing no auth.
      # bubblewrap is dats' native Linux backend; without it dats falls back to
      # docker, where commands run inside the image and lose the linked ts0 and
      # node. ubuntu denies unprivileged user namespaces by default, so the
      # sysctl is what makes bwrap usable.
      - name: Install dats
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          curl -fL --compressed "https://dl.pazer.build/dats?os=linux&arch=amd64" -o /usr/local/bin/dats
          chmod +x /usr/local/bin/dats
          dats --version

      # Every behavioural assertion about the CLI lives in tests/*.dats:
      # tests/cli.dats (init/build/run/test, --config), tests/gate.dats (the
      # type-check gate and the explicit-any ban on every path),
      # tests/samples.dats (every sample under samples/), and
      # tests/html-referenced.dats (the multi-file HTML target). Each test
      # stages its project into its own sandbox and asserts what the build
      # wrote, so a failure names the file and the pattern.
      - name: Behaviour suites (dats)
        run: dats test tests/

      # Not a test -- the assertions are in tests/samples.dats. This builds
      # the two HTML samples into the workspace purely so the artifacts
      # below exist for a human to download and open in a browser.
      - name: Build html samples for the artifacts below
        run: |
          ts0 build --config samples/html/ts0.json
          ts0 build --config samples/html-jsx/ts0.json

      - name: Upload html sample build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-sample
          path: samples/html/dist/index.html

      - name: Upload html-jsx sample build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-jsx-sample
          path: samples/html-jsx/dist/index.html

  # ---------------------------------------------------------------------------
  # Prebuilt ts0.cjs for buildhost: ONE platform-neutral CommonJS file (the
  # CLI + esbuild JS API + the TypeScript compiler inlined) that runs on
  # stock Node >= 22 with no npm, plus the five platform-native esbuild
  # binaries it fetches on first run. Consumers:
  #   curl -fL "https://dl.pazer.build/ts0?v=N&os=linux&arch=amd64" -o ts0.cjs
  #   node ts0.cjs build            # or: curl -fsSL "...?..." | node - build
  # scripts/build-prebuilt.ts documents the packaging; prebuilt-smoke.sh is
  # the bare-node (no npm on PATH) verification.

  prebuilt:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build ts0.cjs + esbuild natives
        run: npm run build:prebuilt

      - name: Bare-node smoke (node on PATH, no npm)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: build-prebuilt/out/
          if-no-files-found: error

  # Repeats the bare-node smoke on real arm64, exercising the linux/arm64
  # esbuild native end-to-end. The darwin/windows natives ship without a CI
  # execution job on purpose: they are upstream esbuild release binaries
  # (registry tarballs verified against the package-lock sha512), and
  # ts0.cjs itself is platform-neutral and fully smoked here.
  smoke-prebuilt-linux-arm64:
    needs: prebuilt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The samples' type-check resolves @types/node and preact from the
      # repo's node_modules -- project dependencies, not toolchain pieces.
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: build-prebuilt/out

      - name: Bare-node smoke (linux/arm64)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

  # The single publish path: master only, gated on both smokes, and driven
  # entirely by the org's ready-made buildhost-publish action -- it
  # self-serves this run's `prebuilt` artifact (hence actions: read),
  # authenticates with a GHA OIDC token (hence id-token: write; buildhost
  # trusts the issuer and auto-provisions projects, public because this repo
  # is public), and maps files by its <binary>_<os>_<arch>[.exe] naming
  # convention:
  #   ts0_cosmo_any                      -> project ts0, ONE artifact under
  #                                         the cosmo/any multi-platform
  #                                         alias (one stored body, resolvable
  #                                         under every ?os=..&arch=.. pair)
  #   esbuild-<version>_<os>_<arch>      -> project ts0/esbuild-<version>,
  #                                         the five natives ts0.cjs fetches
  #                                         on first run
  # Every payload is ~10 MB, far below the direct-upload cap. Every branch
  # publishes: buildhost treats git branch as a first-class field, and the apex
  # "latest" only ever resolves the default branch, so a branch release cannot
  # hijack what stable consumers download. Gating this job on master instead
  # meant the publish path -- the only part of CI that talks to buildhost -- was
  # skipped on every PR, so a change to it passed CI without being run once.
  publish:
    needs: [test, prebuilt, smoke-prebuilt-linux-arm64]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
      artifact-metadata: write
      deployments: write
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          artifact_name: prebuilt
