name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Unit tests (runtime fetch interceptor)
        run: node --experimental-strip-types --test src/runtime/fetch-interceptor.test.ts

      - name: Build ts0
        run: node --experimental-strip-types src/cli.ts build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts0
          path: dist/ts0

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ts0
          path: dist

      - name: Link ts0 globally
        run: npm link

      - name: Test init command
        working-directory: /tmp
        run: |
          mkdir test-project
          cd test-project
          ts0 init

      - name: Test build command
        working-directory: /tmp/test-project
        run: ts0 build

      - name: Test run command
        working-directory: /tmp/test-project
        run: ts0 run

      - name: Test test command
        working-directory: /tmp/test-project
        run: ts0 test

      - name: Type-check gate blocks broken output
        run: |
          # A type error must make EVERY code path -- build, run, run --no-build,
          # and test -- fail and emit/execute nothing. This is the regression
          # guard for "there must be no way to run an invalid program". The error
          # (string assigned to number) strips to valid JS and the test file
          # registers no tests, so a --no-build run or a test run would exit 0 if
          # the type-check were ever skipped: this catches exactly that hole.
          dir=$(mktemp -d)
          printf '%s\n' '{ "entry": "src/main.ts", "outdir": "dist", "target": "node", "format": "esm", "strict": true }' > "$dir/ts0.json"
          mkdir -p "$dir/src"
          printf 'const n: number = "nope";\nexport {};\n' > "$dir/src/main.ts"
          printf 'export {};\n' > "$dir/src/noop.test.ts"
          cd "$dir"
          if ts0 build; then echo "FAIL: ts0 build succeeded despite a type error"; exit 1; fi
          if [ -e dist ]; then echo "FAIL: ts0 build wrote dist/ despite a type error"; exit 1; fi
          if ts0 run; then echo "FAIL: ts0 run succeeded despite a type error"; exit 1; fi
          if [ -e dist ]; then echo "FAIL: ts0 run wrote dist/ despite a type error"; exit 1; fi
          if ts0 run --no-build; then echo "FAIL: ts0 run --no-build executed code despite a type error"; exit 1; fi
          if ts0 test; then echo "FAIL: ts0 test ran tests despite a type error"; exit 1; fi
          echo "Type-check gate OK: build, run, run --no-build, and test all refused broken code"
          # The same gate covers the js (library) target, including its
          # declaration pass: a directory entry with a type error must emit
          # NOTHING -- no .js tree and no partial .d.ts tree (declaration
          # emit only runs after the gate passes, and is itself
          # all-or-nothing via noEmitOnError).
          jsdir=$(mktemp -d)
          printf '%s\n' '{ "entry": "src", "target": "browser" }' > "$jsdir/ts0.json"
          mkdir -p "$jsdir/src"
          printf 'export const ok: number = 1;\n' > "$jsdir/src/good.ts"
          printf 'export const n: number = "nope";\n' > "$jsdir/src/bad.ts"
          cd "$jsdir"
          if ts0 build; then echo "FAIL: js-target build succeeded despite a type error"; exit 1; fi
          if [ -e dist ]; then echo "FAIL: js-target build wrote dist/ despite a type error"; exit 1; fi
          echo "js-target gate OK: no .js and no partial .d.ts emitted"

      - name: Test basic sample
        working-directory: samples/basic
        run: |
          ts0 build
          ts0 test

      - name: Test html sample
        working-directory: samples/html
        run: |
          ts0 build
          test -f dist/index.html
          # The bundled output must inline the JS and CSS, with no remaining
          # local src= or href= references to source files.
          grep -q '<style' dist/index.html
          grep -q 'getElementById' dist/index.html
          ! grep -qE '<script[^>]+src=' dist/index.html
          ! grep -qE '<link[^>]+rel=["'"'"']stylesheet["'"'"']' dist/index.html
          # CSS asset embedding: the body's background-image url() must be
          # rewritten to a data: URL so the bundle works from disk.
          grep -q 'data:image/png;base64' dist/index.html
          # Inline-module bundling: the inline <script type="module"> body
          # imports ./src/greet.ts; the bundled output must contain the
          # call site and resolved import.
          grep -q 'greeting("inline")' dist/index.html
          # Fetch interceptor injection: presence of the patched fetch and
          # the embedded shader text, with no leftover __ASSETS_JSON__.
          grep -q 'window.fetch' dist/index.html
          grep -q 'embedded by ts0' dist/index.html
          ! grep -q '__ASSETS_JSON__' dist/index.html
          # CLI flag overrides: build a different entry to a different
          # outfile without a ts0.json change.
          rm -rf dist
          ts0 build --entry index.html --outfile out/cli-flag.html
          test -f out/cli-flag.html

      - name: Test html-jsx sample
        working-directory: samples/html-jsx
        run: |
          ts0 build
          test -f dist/index.html
          # JSX through an HTML entry must use the automatic Preact runtime,
          # NOT esbuild's default classic transform. A Preact bundle that
          # emits React.createElement throws "React is not defined" at
          # runtime, so assert the classic factory is entirely absent and the
          # preact/jsx-runtime module is bundled in.
          ! grep -q 'React.createElement' dist/index.html
          ! grep -q 'React.Fragment' dist/index.html
          grep -q 'preact/jsx-runtime' dist/index.html
          # The rendered component's text must survive bundling.
          grep -q 'ts0 + Preact' dist/index.html

      - name: Test js sample
        working-directory: samples/js
        run: |
          ts0 build
          # Directory entry -> "js" library target: every src/**/*.ts is
          # compiled to a parallel dist/**/*.js, structure preserved.
          test -f dist/math/vec.js
          test -f dist/math/shape.js
          test -f dist/gfx/shader.js
          # Declaration files are not compiled to outputs.
          ! test -e dist/shaders.js
          # sourcemap:false in ts0.json -> no .map files.
          ! test -e dist/math/vec.js.map
          # ESM output.
          grep -q 'export' dist/math/vec.js
          # No duplication: add() is shared (vec.ts is an entry AND shape.ts
          # imports it), so it must be emitted once into a chunk and imported,
          # never inlined into each output. Assert the body lives in exactly one
          # file, a chunk exists, and shape.js imports it rather than inlining.
          test "$(grep -rl 'a\[0\] + b\[0\]' dist | wc -l)" -eq 1
          ls dist/chunk-*.js >/dev/null
          grep -q 'chunk-' dist/math/shape.js
          ! grep -q 'a\[0\] + b\[0\]' dist/math/shape.js
          # loaders config: a non-shared .frag import is inlined as text
          # (proves the text loader ran; a JS-module import would error).
          grep -q 'FRAG_MARKER' dist/gfx/shader.js
          # Declarations (default-on for the js target): every compiled
          # module gets a parallel .d.ts mirroring the source tree.
          test -f dist/index.d.ts
          test -f dist/badge.d.ts
          test -f dist/math/vec.d.ts
          test -f dist/math/shape.d.ts
          test -f dist/gfx/shader.d.ts
          # .ts/.tsx extension specifiers are preserved in declaration output
          # (consumers resolve them to the sibling .d.ts by extension
          # substitution); extensionless imports stay extensionless.
          grep -q '"./math/vec.ts"' dist/index.d.ts
          grep -q '"./badge.tsx"' dist/index.d.ts
          grep -q '"./vec"' dist/math/shape.d.ts
          # The .tsx component's declaration types it via the configured
          # jsxImportSource, and the loader-backed import erases to the
          # annotated plain type (no leaked import of "./triangle.frag").
          grep -q 'import("preact")' dist/badge.d.ts
          grep -q 'triangleShader: string' dist/gfx/shader.d.ts
          ! grep -q 'triangle.frag' dist/gfx/shader.d.ts
          # Test files produce no output of either kind, and the ambient
          # declaration source (src/shaders.d.ts) is not copied to dist.
          ! test -e dist/math/vec.test.js
          ! test -e dist/math/vec.test.d.ts
          ! test -e dist/shaders.d.ts
          # Shared chunks are esbuild artifacts, not source modules: the
          # declaration tree mirrors sources, so chunks get NO .d.ts.
          test -z "$(find dist -name 'chunk-*.d.ts')"
          # sourcemap/shebang behavior is unchanged: no .d.ts.map files
          # (declarationMap is never enabled), and no shebang on outputs.
          test -z "$(find dist -name '*.d.ts.map')"
          ! head -1 dist/index.js | grep -q '^#!'
          # Determinism: rebuilding from the same input must produce
          # byte-identical .d.ts (consumers commit fetched copies and rely
          # on freshness diffs).
          before=$(find dist -name '*.d.ts' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          rm -rf dist
          ts0 build
          after=$(find dist -name '*.d.ts' -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          test "$before" = "$after"

      - name: js target declarations opt-out
        run: |
          # "declarations": false must skip the .d.ts pass entirely while the
          # .js tree still builds -- the escape hatch for projects that can't
          # or don't want to ship declarations.
          dir=$(mktemp -d)
          printf '%s\n' '{ "entry": "src", "target": "browser", "declarations": false }' > "$dir/ts0.json"
          mkdir -p "$dir/src"
          printf 'export const one: number = 1;\n' > "$dir/src/one.ts"
          cd "$dir"
          ts0 build
          test -f dist/one.js
          test -z "$(find dist -name '*.d.ts')"
          echo "Opt-out OK: .js emitted, no .d.ts"

      - name: Upload html sample build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-sample
          path: samples/html/dist/index.html

      - name: Upload html-jsx sample build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-jsx-sample
          path: samples/html-jsx/dist/index.html

  # ---------------------------------------------------------------------------
  # Prebuilt ts0.cjs for buildhost: ONE platform-neutral CommonJS file (the
  # CLI + esbuild JS API + the TypeScript compiler inlined) that runs on
  # stock Node >= 22 with no npm, plus the five platform-native esbuild
  # binaries it fetches on first run. Consumers:
  #   curl -fL "https://dl.pazer.build/ts0?v=N&os=linux&arch=amd64" -o ts0.cjs
  #   node ts0.cjs build            # or: curl -fsSL "...?..." | node - build
  # scripts/build-prebuilt.ts documents the packaging; prebuilt-smoke.sh is
  # the bare-node (no npm on PATH) verification.

  prebuilt:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build ts0.cjs + esbuild natives
        run: npm run build:prebuilt

      - name: Bare-node smoke (node on PATH, no npm)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: build-prebuilt/out/
          if-no-files-found: error

  # Repeats the bare-node smoke on real arm64, exercising the linux/arm64
  # esbuild native end-to-end. The darwin/windows natives ship without a CI
  # execution job on purpose: they are upstream esbuild release binaries
  # (registry tarballs verified against the package-lock sha512), and
  # ts0.cjs itself is platform-neutral and fully smoked here.
  smoke-prebuilt-linux-arm64:
    needs: prebuilt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The samples' type-check resolves @types/node and preact from the
      # repo's node_modules -- project dependencies, not toolchain pieces.
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: build-prebuilt/out

      - name: Bare-node smoke (linux/arm64)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

  # The single publish path: master only, gated on both smokes. Auth is a
  # GitHub Actions OIDC token (buildhost trusts the issuer directly and
  # auto-provisions projects on first push; public because this repo is
  # public). Two buildhost projects:
  #   ts0/esbuild-<version>  the five natives -- immutable per esbuild
  #                          version, published only when that version's
  #                          project has nothing downloadable yet;
  #   ts0                    ts0.cjs, one release per master merge, uploaded
  #                          ONCE under os=cosmo/arch=any (buildhost's
  #                          multi-platform alias: one stored body, rows for
  #                          every os/arch pair, so any ?os=..&arch=..
  #                          download resolves).
  # Natives publish first so a fresh ts0.cjs never points at unpublished
  # natives. Every payload is far below the ~95 MiB direct-upload cap.
  publish:
    if: github.ref == 'refs/heads/master'
    needs: [test, prebuilt, smoke-prebuilt-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt

      - name: Publish to buildhost
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const server = "https://pazer.build";
            const dl = "https://dl.pazer.build";
            const token = await core.getIDToken(server);
            if (!token) {
              core.setFailed("failed to mint an OIDC token for buildhost");
              return;
            }

            const meta = JSON.parse(fs.readFileSync("prebuilt/meta.json", "utf-8")) as {
              esbuildVersion: string;
              buildId: string;
              natives: { os: string; arch: string; file: string }[];
            };
            const nativesProject = `ts0/esbuild-${meta.esbuildVersion}`;

            // Small retry for transient edge errors during buildhost deploys
            // (5xx / connection failures / empty-body 404s from the proxy; a
            // real app error always carries a JSON body).
            const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));
            const api = async (method: string, urlPath: string, body?: Buffer | string, headers: Record<string, string> = {}) => {
              const h: Record<string, string> = { Authorization: `Bearer ${token}`, ...headers };
              if (typeof body === "string") h["Content-Type"] = "application/json";
              else if (body) h["Content-Type"] = "application/octet-stream";
              for (let attempt = 1; ; attempt++) {
                try {
                  const resp = await fetch(`${server}${urlPath}`, { method, headers: h, body });
                  const text = await resp.text();
                  if (attempt >= 3 || !(resp.status >= 500 || (resp.status === 404 && text.trim() === ""))) {
                    return { status: resp.status, text };
                  }
                  core.warning(`${method} ${urlPath} -> HTTP ${resp.status} (transient, attempt ${attempt}/3)`);
                } catch (err) {
                  if (attempt >= 3) return { status: 0, text: String(err) };
                  core.warning(`${method} ${urlPath} -> ${String(err)} (attempt ${attempt}/3)`);
                }
                await sleep(1000 * 2 ** (attempt - 1));
              }
            };

            const releaseBody = JSON.stringify({ git_branch: github.ref_name, git_commit: github.sha });

            const publishRelease = async (
              project: string,
              artifacts: { os: string; arch: string; file: string; filename: string }[],
            ): Promise<string> => {
              const created = await api("POST", `/api/v1/projects/${project}/releases`, releaseBody);
              if (created.status !== 201) {
                throw new Error(`create release for ${project} failed (${created.status}): ${created.text}`);
              }
              const version = (JSON.parse(created.text) as { version: string }).version;
              for (const a of artifacts) {
                const bytes = fs.readFileSync(a.file);
                const put = await api(
                  "PUT",
                  `/api/v1/projects/${project}/releases/${version}/artifacts/${a.os}/${a.arch}?kind=binary`,
                  bytes,
                  { "X-Artifact-Filename": a.filename },
                );
                if (put.status !== 201) {
                  throw new Error(`upload ${project} ${a.os}/${a.arch} failed (${put.status}): ${put.text}`);
                }
                core.info(`uploaded ${project}/${version} ${a.os}/${a.arch} (${bytes.length} bytes)`);
              }
              const pub = await api("POST", `/api/v1/projects/${project}/releases/${version}/publish`);
              if (pub.status !== 200) {
                throw new Error(`publish ${project}/${version} failed (${pub.status}): ${pub.text}`);
              }
              core.info(`published ${project}/${version}`);
              return version;
            };

            // 1) The natives, once per esbuild version: skip when that
            // version's project already resolves a download (immutable).
            const nativeProbeUrl = `${dl}/${nativesProject}?os=linux&arch=amd64`;
            const probe = await fetch(nativeProbeUrl, { method: "HEAD", redirect: "manual" });
            if (probe.status === 200 || probe.status === 302) {
              core.info(`${nativesProject} already published (probe HTTP ${probe.status}); skipping natives`);
            } else {
              core.info(`probe ${nativeProbeUrl} -> HTTP ${probe.status}; publishing natives`);
              await publishRelease(
                nativesProject,
                meta.natives.map((n) => ({
                  os: n.os,
                  arch: n.arch,
                  file: `prebuilt/${n.file}`,
                  filename: n.os === "windows" ? "esbuild.exe" : "esbuild",
                })),
              );
            }

            // 2) ts0.cjs: one platform-neutral artifact per release, stored
            // once and addressable under every os/arch pair.
            const version = await publishRelease("ts0", [
              { os: "cosmo", arch: "any", file: "prebuilt/ts0.cjs", filename: "ts0.cjs" },
            ]);

            // The consumer-visible contract: both download URLs resolve.
            for (const url of [
              `${dl}/ts0?branch=${github.ref_name}&os=linux&arch=amd64`,
              nativeProbeUrl,
            ]) {
              const resp = await fetch(url, { method: "HEAD", redirect: "manual" });
              core.info(`${url} -> HTTP ${resp.status}`);
              if (resp.status !== 302 && resp.status !== 200) {
                core.setFailed(`published, but ${url} did not resolve (HTTP ${resp.status})`);
                return;
              }
            }
            core.notice(`ts0 v${version} published: ${dl}/ts0?v=${version}&os=linux&arch=amd64`);
