name: CI

on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Unit tests
        run: node --experimental-strip-types --test "src/**/*.test.ts"

      - name: Build ts0
        run: node --experimental-strip-types src/cli.ts build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts0
          path: dist/ts0

  test:
    needs: build
    # bwrap gets no user namespace on the plain pool, so dats falls back to docker.
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ts0
          path: dist

      - name: Link ts0 globally
        run: npm link

      # Every behavioural assertion about the CLI lives here; docs/testing.md says what each covers.
      - name: Behaviour suites (dats)
        uses: wow-look-at-my/dats@master
        with:
          tests: tests/

      # Not a test (tests/samples.dats asserts these): it makes the artifacts below downloadable.
      - name: Build html samples for the artifacts below
        run: |
          ts0 build --config samples/html/ts0.json
          ts0 build --config samples/html-jsx/ts0.json

      - name: Upload html sample build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-sample
          path: samples/html/dist/index.html

      - name: Upload html-jsx sample build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-jsx-sample
          path: samples/html-jsx/dist/index.html

  # Packages ts0 for buildhost; the contract is docs/prebuilt-ts0-cjs.md.
  prebuilt:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build ts0.cjs + esbuild natives
        run: npm run build:prebuilt

      - name: Bare-node smoke (node on PATH, no npm)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: build-prebuilt/out/
          if-no-files-found: error

  # Repeats the smoke on real arm64, so the linux/arm64 esbuild native runs end to end.
  smoke-prebuilt-linux-arm64:
    needs: prebuilt
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The samples resolve @types/node and preact here: project deps, not toolchain.
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: build-prebuilt/out

      - name: Bare-node smoke (linux/arm64)
        run: scripts/prebuilt-smoke.sh build-prebuilt/out/ts0.cjs build-prebuilt/out

  # Every branch publishes; "latest" still only ever resolves the default branch.
  publish:
    needs: [test, prebuilt, smoke-prebuilt-linux-arm64]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
      artifact-metadata: write
      deployments: write
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          artifact_name: prebuilt
