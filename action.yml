name: Run ts0
description: Type-check, test and build a ts0 project, without a caller having to hand-roll the download

# No input for WHAT to run: a caller that can choose the command can choose `--help`.
inputs:
  working-directory:
    description: 'Directory to run ts0 from'
    required: false
    default: '.'

outputs:
  path:
    description: 'Full path to the downloaded ts0.cjs'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # Optional inputs omitted on purpose: ts0 is a build tool, so CI tracks latest.
    - name: Download ts0
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: ts0

    # `test` type-checks before it discovers a file, so this gates a project with no tests.
    - name: ts0 test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TS0: ${{ steps.download.outputs.path }}
      run: node "$TS0" test

    - name: ts0 build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TS0: ${{ steps.download.outputs.path }}
      run: node "$TS0" build
